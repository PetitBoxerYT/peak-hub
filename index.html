<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Multiplayer Hub</title>

  <!-- Favicon Peak -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Police Peak -->
  <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Darumadrop One", sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    #user-info {
      margin-top: 10px;
      font-size: 18px;
    }

    button {
      font-family: inherit;
      padding: 10px 20px;
      margin-right: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #6EC3FF;
      color: black;
      font-size: 16px;
      border: 3px solid black;
    }

    button:hover {
      background: #8ed3ff;
    }
  </style>
</head>

<body>

  <h1>Peak Multiplayer Hub</h1>

  <!-- Boutons Auth -->
  <button onclick="login()">Se connecter avec Google</button>
  <button onclick="logout()">Se déconnecter</button>

  <!-- Affichage utilisateur -->
  <div id="user-info">Non connecté</div>

  <hr>

  <!-- Ici tu ajouteras ton interface de lobbys -->
  <p>Interface des lobbys à venir…</p>

  <!-- Firebase Auth -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // 🔥 Configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDb0hPFAQ2X-czfL71R3tJMU3cue84koTE",
      authDomain: "peak-hub-803e8.firebaseapp.com",
      projectId: "peak-hub-803e8",
      storageBucket: "peak-hub-803e8.firebasestorage.app",
      messagingSenderId: "660080957005",
      appId: "1:660080957005:web:57e94fde72d949ee69ee04",
      measurementId: "G-DH9YF0MZSW"
    };

    // Initialisation Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 🔐 Fonctions de connexion / déconnexion
    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    // 👤 Suivi de l'état de connexion
    onAuthStateChanged(auth, user => {
      const info = document.getElementById("user-info");
      if (user) {
        info.textContent = `Connecté en tant que ${user.displayName}`;
        window.currentUser = user;
      } else {
        info.textContent = "Non connecté";
        window.currentUser = null;
      }
    });
  </script>

  <script type="module">
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    deleteDoc, 
    doc, 
    onSnapshot 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const db = getFirestore();

  // Référence à la collection
  const lobbiesRef = collection(db, "lobbies");

  // 🔥 Ajouter un lobby
  window.addLobby = async (url, label) => {
    if (!window.currentUser) {
      alert("Tu dois être connecté pour créer un lobby");
      return;
    }

    await addDoc(lobbiesRef, {
      url,
      label,
      owner: window.currentUser.uid,
      createdAt: Date.now()
    });
  };

  // 🔥 Supprimer un lobby
  window.deleteLobby = async (id, owner) => {
    if (!window.currentUser || window.currentUser.uid !== owner) {
      alert("Tu ne peux pas supprimer le lobby de quelqu'un d'autre");
      return;
    }

    await deleteDoc(doc(db, "lobbies", id));
  };

  // 🔥 Affichage en temps réel
  onSnapshot(lobbiesRef, snapshot => {
    const container = document.getElementById("lobbies");
    container.innerHTML = "";

    snapshot.forEach(docu => {
      const data = docu.data();
      const div = document.createElement("div");

      div.innerHTML = `
        <p><strong>${data.label}</strong></p>
        <p>${data.url}</p>
        <button onclick="deleteLobby('${docu.id}', '${data.owner}')">Supprimer</button>
        <hr>
      `;

      container.appendChild(div);
    });
  });
</script>

</body>
</html>
