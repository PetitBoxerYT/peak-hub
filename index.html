<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Multiplayer Hub</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Darumadrop One", system-ui, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 { font-size: 32px; margin-bottom: 10px; }
    h2, h3 { margin-top: 30px; }

    #user-info { margin-top: 10px; font-size: 18px; }

    button {
      font-family: inherit;
      padding: 10px 20px;
      margin: 5px 10px 5px 0;
      border-radius: 8px;
      cursor: pointer;
      background: #6EC3FF;
      color: black;
      font-size: 16px;
      border: 3px solid black;
    }

    button:hover { background: #8ed3ff; }

    input {
      font-family: inherit;
      padding: 8px 10px;
      margin: 5px 10px 5px 0;
      border-radius: 6px;
      border: 2px solid #000;
      font-size: 14px;
    }

    #lobbies > div {
      background: white;
      border-radius: 10px;
      border: 3px solid black;
      padding: 10px;
      margin-bottom: 10px;
    }

    .lobby-url {
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>Peak Multiplayer Hub</h1>

  <!-- Affichage utilisateur -->
  <div id="user-info">Connexion…</div>

  <h2>Lobbys disponibles</h2>
  <div id="lobbies"></div>

  <h3>Créer un lobby</h3>
  <input id="lobby-url" placeholder="steam://joinlobby/..." size="40">
  <input id="lobby-label" placeholder="Nom du lobby" size="25">
  <button onclick="addLobby(
    document.getElementById('lobby-url').value,
    document.getElementById('lobby-label').value
  )">Ajouter</button>

  <!-- Firestore -->
  <script type="module">
    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    /* ------------------------------
       1) ID LOCAL
       ------------------------------ */
    if (!localStorage.getItem("peakUserId")) {
      localStorage.setItem("peakUserId", crypto.randomUUID());
    }
    const localUserId = localStorage.getItem("peakUserId");

    /* ------------------------------
       2) PSEUDO LOCAL
       ------------------------------ */
    if (!localStorage.getItem("peakPseudo")) {
      const pseudo = prompt("Choisis ton pseudo Peak :");
      localStorage.setItem("peakPseudo", pseudo || "Joueur");
    }
    const localPseudo = localStorage.getItem("peakPseudo");

    document.getElementById("user-info").textContent =
      "Connecté en tant que " + localPseudo +
      " (ID : " + localUserId.slice(0, 8) + "…)";

    /* ------------------------------
       3) Firebase (Firestore uniquement)
       ------------------------------ */
    const firebaseConfig = {
      apiKey: "AIzaSyDb0hPFAQ2X-czfL71R3tJMU3cue84koTE",
      authDomain: "peak-hub-803e8.firebaseapp.com",
      projectId: "peak-hub-803e8",
      storageBucket: "peak-hub-803e8.firebasestorage.app",
      messagingSenderId: "660080957005",
      appId: "1:660080957005:web:57e94fde72d949ee69ee04",
      measurementId: "G-DH9YF0MZSW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const lobbiesRef = collection(db, "lobbies");
    const lobbiesQuery = query(lobbiesRef, orderBy("createdAt", "desc"));

    /* ------------------------------
       4) Ajouter un lobby
       ------------------------------ */
    window.addLobby = async (url, label) => {
      if (!url || !label) {
        alert("Merci de remplir l’URL et le nom du lobby");
        return;
      }

      await addDoc(lobbiesRef, {
        url,
        label,
        owner: localUserId,
        pseudo: localPseudo,
        createdAt: Date.now()
      });

      document.getElementById("lobby-url").value = "";
      document.getElementById("lobby-label").value = "";
    };

    /* ------------------------------
       5) Supprimer un lobby
       ------------------------------ */
    window.deleteLobby = async (id, owner) => {
      if (localUserId !== owner) {
        alert("Tu ne peux pas supprimer le lobby de quelqu'un d'autre");
        return;
      }
      await deleteDoc(doc(db, "lobbies", id));
    };

    /* ------------------------------
       6) Affichage en temps réel
       ------------------------------ */
    onSnapshot(lobbiesQuery, snapshot => {
      const container = document.getElementById("lobbies");
      container.innerHTML = "";

      snapshot.forEach(docu => {
        const data = docu.data();
        const div = document.createElement("div");

        const isOwner = localUserId === data.owner;

        div.innerHTML = `
  <p><strong>${data.label}</strong> <small>(${data.pseudo})</small></p>
  <p class="lobby-url">${data.url}</p>

  <button onclick="window.location.href='${data.url}'">Rejoindre</button>

  ${isOwner
    ? `<button onclick="deleteLobby('${docu.id}', '${data.owner}')">Supprimer mon lobby</button>`
    : `<small>Créé par ${data.pseudo}</small>`}
`;


        container.appendChild(div);
      });
    });
  </script>

</body>
</html>
