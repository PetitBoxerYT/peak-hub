<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Multiplayer Hub</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Darumadrop One", system-ui, sans-serif;
      background: #e8f4ff;
      margin: 0;
      padding: 20px;
    }

    h1 { font-size: 36px; margin-bottom: 10px; }
    h2, h3 { margin-top: 30px; }

    #user-info { margin-top: 10px; font-size: 18px; }

    button {
      font-family: inherit;
      padding: 10px 20px;
      margin: 5px 10px 5px 0;
      border-radius: 8px;
      cursor: pointer;
      background: #6EC3FF;
      color: black;
      font-size: 16px;
      border: 3px solid black;
      transition: 0.15s;
    }

    button:hover { background: #8ed3ff; transform: translateY(-2px); }

    input {
      font-family: inherit;
      padding: 8px 10px;
      margin: 5px 10px 5px 0;
      border-radius: 6px;
      border: 2px solid #000;
      font-size: 14px;
    }

    #lobbies > div {
      background: white;
      border-radius: 12px;
      border: 3px solid black;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 4px 4px 0px #000;
    }

    .lobby-url {
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
    }

    .voice-link a {
      color: #0066cc;
      text-decoration: none;
      font-weight: bold;
    }

    .voice-link a:hover {
      text-decoration: underline;
    }

    #online-list div {
      background: #fff;
      border: 2px solid #000;
      padding: 5px 10px;
      margin: 5px 0;
      border-radius: 6px;
      display: inline-block;
    }
  </style>
</head>

<body>

  <h1>Peak Multiplayer Hub</h1>

  <!-- Affichage utilisateur -->
  <div id="user-info">Connexion…</div>
  <button onclick="changePseudo()">Changer de pseudo</button>
  <button onclick="leaveHub()">Je ne joue plus</button>

  <h2>Joueurs connectés : <span id="online-count">0</span></h2>
  <div id="online-list"></div>

  <h2>Lobbys disponibles</h2>
  <div id="lobbies"></div>

  <h3>Créer un lobby</h3>
  <input id="lobby-url" placeholder="steam://joinlobby/..." size="40">
  <input id="lobby-label" placeholder="Nom du lobby" size="25">
  <input id="lobby-desc" placeholder="Description du lobby" size="40">
  <input id="lobby-voice" placeholder="Lien du salon vocal (optionnel)" size="40">

  <button onclick="addLobby(
    document.getElementById('lobby-url').value,
    document.getElementById('lobby-label').value
  )">Ajouter</button>

  <!-- Firestore -->
  <script type="module">
  import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    setDoc,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  // 1) ID LOCAL
  if (!localStorage.getItem("peakUserId")) {
    localStorage.setItem("peakUserId", crypto.randomUUID());
  }
  const localUserId = localStorage.getItem("peakUserId");

  // 2) PSEUDO LOCAL
  if (!localStorage.getItem("peakPseudo")) {
    const pseudo = prompt("Choisis ton pseudo Peak :");
    localStorage.setItem("peakPseudo", pseudo || "Joueur");
  }
  let localPseudo = localStorage.getItem("peakPseudo");

  document.getElementById("user-info").textContent =
    "Connecté en tant que " + localPseudo +
    " (ID : " + localUserId.slice(0, 8) + "…)";

  // 3) Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDb0hPFAQ2X-czfL71R3tJMU3cue84koTE",
    authDomain: "peak-hub-803e8.firebaseapp.com",
    projectId: "peak-hub-803e8",
    storageBucket: "peak-hub-803e8.firebasestorage.app",
    messagingSenderId: "660080957005",
    appId: "1:660080957005:web:57e94fde72d949ee69ee04",
    measurementId: "G-DH9YF0MZSW"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 4) Lobbys
  const lobbiesRef = collection(db, "lobbies");
  const lobbiesQuery = query(lobbiesRef, orderBy("createdAt", "desc"));

  window.addLobby = async (url, label) => {
    const desc = document.getElementById("lobby-desc").value;
    const voice = document.getElementById("lobby-voice").value;

    if (!url || !label) {
      alert("Merci de remplir l’URL et le nom du lobby");
      return;
    }

    let voiceLink = voice;
    if (voice && !voice.startsWith("http://") && !voice.startsWith("https://")) {
      voiceLink = "https://" + voice;
    }

    try {
      await addDoc(lobbiesRef, {
        url,
        label,
        desc,
        voice: voiceLink,
        owner: localUserId,
        pseudo: localPseudo,
        createdAt: Date.now()
      });
    } catch (e) {
      console.error("Erreur addLobby:", e);
      alert("Impossible d’ajouter le lobby (permissions Firestore ?)");
      return;
    }

    document.getElementById("lobby-url").value = "";
    document.getElementById("lobby-label").value = "";
    document.getElementById("lobby-desc").value = "";
    document.getElementById("lobby-voice").value = "";
  };

  window.deleteLobby = async (id, owner) => {
    if (localUserId !== owner) {
      alert("Tu ne peux pas supprimer le lobby de quelqu'un d'autre");
      return;
    }
    try {
      await deleteDoc(doc(db, "lobbies", id));
    } catch (e) {
      console.error("Erreur deleteLobby:", e);
      alert("Impossible de supprimer le lobby (permissions Firestore ?)");
    }
  };

  onSnapshot(lobbiesQuery, snapshot => {
    const container = document.getElementById("lobbies");
    container.innerHTML = "";

    snapshot.forEach(docu => {
      const data = docu.data();
      const div = document.createElement("div");

      const isOwner = localUserId === data.owner;

      div.innerHTML = `
        <p><strong>${data.label}</strong> <small>(${data.pseudo})</small></p>
        <p>${data.desc || ""}</p>

        ${data.voice
          ? `<p class="voice-link">Salon vocal : <a href="${data.voice}" target="_blank">${data.voice}</a></p>`
          : ""
        }

        <p class="lobby-url">${data.url}</p>

        <button onclick="window.open('${data.url}', '_blank')">Rejoindre</button>

        ${isOwner
          ? `<button onclick="deleteLobby('${docu.id}', '${data.owner}')">Supprimer mon lobby</button>`
          : `<small>Créé par ${data.pseudo}</small>`}
      `;

      container.appendChild(div);
    });
  });

  // 5) Changer de pseudo
  window.changePseudo = () => {
    const nouveau = prompt("Nouveau pseudo :");
    if (!nouveau) return;

    localStorage.setItem("peakPseudo", nouveau);
    localPseudo = nouveau;

    document.getElementById("user-info").textContent =
      "Connecté en tant que " + nouveau +
      " (ID : " + localUserId.slice(0, 8) + "…)";

    alert("Pseudo mis à jour !");
  };

  // 6) Présence (joueurs connectés) – isolée pour ne pas casser le reste
  const onlineUsersRef = collection(db, "onlineUsers");
  let onlineRef = doc(db, "onlineUsers", localUserId);

  window.leaveHub = async () => {
    try {
      await deleteDoc(onlineRef);
      alert("Tu as quitté le Hub.");
    } catch (e) {
      console.error("Erreur leaveHub:", e);
    }
  };

  (async () => {
    try {
      await setDoc(onlineRef, {
        pseudo: localPseudo,
        lastSeen: Date.now()
      });

      setInterval(() => {
        setDoc(onlineRef, {
          pseudo: localPseudo,
          lastSeen: Date.now()
        }).catch(e => console.error("Erreur update presence:", e));
      }, 30000);

      window.addEventListener("beforeunload", () => {
        deleteDoc(onlineRef).catch(() => {});
      });

      onSnapshot(onlineUsersRef, snapshot => {
        const now = Date.now();
        const list = document.getElementById("online-list");
        list.innerHTML = "";

        let count = 0;

        snapshot.forEach(docu => {
          const data = docu.data();
          if (now - data.lastSeen < 60000) {
            count++;
            const div = document.createElement("div");
            div.textContent = data.pseudo;
            list.appendChild(div);
          }
        });

        document.getElementById("online-count").textContent = count;
      });
    } catch (e) {
      console.error("Erreur présence (onlineUsers):", e);
      // On n’affiche rien, mais surtout on ne bloque pas le reste
    }
  })();
</script>


</body>
</html>
