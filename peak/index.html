<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PEAK – Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>PEAK – Hub Multijoueur</h1>

    <div class="card">
        <h2>Connexion…</h2>
        <p id="connectedInfo">Chargement de ton pseudo…</p>
        <button class="secondary">Changer de pseudo</button>
        <button class="danger">Je ne joue plus</button>
    </div>

    <div class="card">
        <h2>Joueurs connectés :</h2>
        <div id="playersList"></div>
    </div>

    <div class="card">
        <h2>Créer un lobby</h2>
        <label>steam://joinlobby/...</label>
        <input placeholder="steam://joinlobby/...">
        <label>Nom du lobby</label>
        <input>
        <label>Description du lobby</label>
        <input>
        <label>Lien du salon vocal (optionnel)</label>
        <input>
        <button class="primary">Ajouter</button>
    </div>

    <div class="card">
        <h2>Lobbys disponibles</h2>
        <div id="lobbyList"></div>
    </div>
</div>
<script type="module" src="script.js"></script>
</body>
</html>
